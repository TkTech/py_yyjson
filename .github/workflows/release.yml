on:
  release:
    types:
      - published
  push:
    branches:
      - main
  pull_request:

name: Create release

jobs:
  # Build & test simple source release before wasting hours building and
  # testing the binary build matrix.
  sdist:
    name: Creating source release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Setting up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Installing python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools build

      - name: Building source distribution
        run: |
          pip install -e ".[test,release]"
          python -m build . --sdist

      - name: Running tests
        run: |
          pytest

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  docs:
    name: Building documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Setting up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Installing release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[release]"

      - name: Building documentation
        run: |
          sphinx-build -W -n --keep-going -b html docs docs/_build/html

  build_wheels:
    needs: [sdist]
    name: "[${{ strategy.job-index }}/${{ strategy.job-total }}] py${{ matrix.py }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        py: ["cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "pp311"]

    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-python@v6
        name: Setting up Python
        with:
          python-version: '3.13'

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build & test wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS_LINUX: auto aarch64 ppc64le s390x
          CIBW_ARCHS_MACOS: x86_64 arm64 universal2
          CIBW_BUILD: "${{ matrix.py }}-*"
          CIBW_TEST_SKIP: "*_aarch64 *_ppc64le *_s390x"

      - uses: actions/upload-artifact@v4.6.0
        with:
          name: dist-${{ matrix.os }}-${{ matrix.py }}
          path: ./wheelhouse/*.whl

  upload_all:
    needs: [build_wheels, sdist]
    name: Uploading built packages to pypi for release.
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - uses: actions/download-artifact@v4.1.8
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.4.2
      with:
        user: ${{ secrets.PYPI_USERNAME }}
        password: ${{ secrets.PYPI_PASSWORD }}

  build_documentation:
    name: Building & uploading documentation.
    needs: [upload_all]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v3

      - name: Setting up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Installing python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools build

      - name: Installing release dependencies.
        run: |
          pip install -e ".[test,release]"

      - name: Building documentation
        run: |
          cd docs && make clean && make html

      - name: Publishing documentation
        run: |
          ghp-import -f -n -p docs/_build/html