[build-system]
requires = ["setuptools>=74.1"]
build-backend = "setuptools.build_meta"

[project]
name = "yyjson"
version = "5.0.0"
description = "JSON parser & serializer built on yyjson"
readme = "README.md"
authors = [
    {name = "Tyler Kennedy", email = "tk@tkte.ch" }
]
license = { file= "LICENSE" }
keywords = ["json", "parser", "serializer", "patcher"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/tktech/py_yyjson"
Repository = "https://github.com/tktech/py_yyjson.git"

[project.optional-dependencies]
test = ["pytest"]
release = [
    "sphinx",
    "sphinx-copybutton",
    "myst-parser",
    "ghp-import",
    "bumpversion",
    "black",
    "furo"
]

[tool.setuptools]
ext-modules = [
    { name = "cyyjson", sources = ["yyjson/binding.c", "yyjson/yyjson.c", "yyjson/memory.c", "yyjson/document.c", "yyjson/sax.c"] }
]
packages = ["yyjson"]

[tool.setuptools.package-data]
yyjson = ["py.typed", "*.pyi"]

[tool.cibuildwheel]
enable = ["pypy"]
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.uv]
cache-keys = [
    { file = "yyjson/*.c" },
    { file = "yyjson/*.h" }
]
